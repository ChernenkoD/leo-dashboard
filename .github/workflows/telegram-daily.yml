name: Telegram Daily Digest + Photo Sync

permissions:
  contents: write

on:
  schedule:
    # Ежедневный дайджест — каждое утро в 8:00 (Berlin time = UTC+2, значит 06:00 UTC)
    - cron: '0 6 * * *'
    # Синхронизация фото — каждые 10 минут
    - cron: '*/10 6-20 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install requests

      - name: Photo sync (скачать фото из Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: python scraper/telegram_photo_sync.py

      - name: Daily digest (только в 8:00)
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          python3 -c "
          import json, sys, os
          sys.path.insert(0, 'scraper')
          from telegram_bot import send_daily_digest
          try:
              with open('data.json', encoding='utf-8') as f:
                  data = json.load(f)
              maengel = [m for m in data.get('maengel', []) if m.get('mangel_status') != 'geprueft']
              send_daily_digest(maengel)
              print(f'Дайджест отправлен для {len(maengel)} Mängel')
          except Exception as e:
              print(f'Ошибка дайджеста: {e}')
          "

      - name: Commit photos
        run: |
          git config user.name "leo-bot"
          git config user.email "leo-bot@users.noreply.github.com"
          git add photos/ scraper/telegram_offset.json scraper/telegram_topics.json || true
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi
          git commit -m "Auto-sync: Telegram photos"
          # commit (не reset --soft!) — иначе любой файл, не добавленный явно выше,
          # молча откатывается к состоянию checkout'а, стирая параллельные пуши
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "Не удалось запушить после 5 попыток" >&2
          exit 1
